<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">RayPath SCPT Cone and Ray horizontal logo</title>
  <desc id="desc">A copper seismic source sends three teal refracted rays through subsurface layers to receivers in a borehole, beside the RayPath SCPT wordmark.</desc>
  <g transform="translate(10 10)">
    <rect x="2" y="2" width="156" height="156" rx="30" fill="#E8F2EF" stroke="#147D75" stroke-width="5"/>
    <g fill="none" stroke="#8FBDB7" stroke-width="3">
      <path d="M22 47h116M22 80h116M22 113h116"/>
    </g>
    <path d="M130 20v120" fill="none" stroke="#163F3B" stroke-width="7" stroke-linecap="round"/>
    <g fill="none" stroke="#147D75" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 25 53 41 89 44 130 47"/>
      <path d="M28 25 49 64 86 77 130 80"/>
      <path d="M28 25 46 94 82 110 130 113"/>
    </g>
    <circle cx="28" cy="25" r="10" fill="#C87941"/>
    <g fill="#147D75">
      <path d="m121 47 9-7v14z"/>
      <path d="m121 80 9-7v14z"/>
      <path d="m121 113 9-7v14z"/>
    </g>
  </g>
  <text x="205" y="86" fill="#163F3B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1">RayPath <tspan fill="#147D75">SCPT</tspan></text>
  <text x="210" y="124" fill="#5F746F" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" letter-spacing="0.4">FORWARD RAY-PATH SHEAR-WAVE INTERPRETATION</text>
</svg>
